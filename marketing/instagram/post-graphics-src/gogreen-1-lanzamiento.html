<!doctype html>
<html lang="es"><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    width:1080px;height:1350px;overflow:hidden;color:#fff;position:relative;
    background:linear-gradient(160deg,#064e3b 0%,#065f46 55%,#047857 100%);
    display:flex;flex-direction:column;justify-content:center;padding:170px 90px 90px}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle,rgba(110,231,183,.16) 0%,rgba(110,231,183,0) 70%);
    bottom:-280px;right:-260px}
  .watermark{position:absolute;font-size:620px;opacity:.06;bottom:-130px;left:-90px;
    transform:rotate(-14deg);line-height:1}
  .top{position:absolute;top:62px;left:90px;display:flex;align-items:center;gap:16px}
  .logo{background:#f59e0b;color:#0f172a;font-weight:900;font-size:30px;width:56px;height:56px;
    border-radius:14px;display:flex;align-items:center;justify-content:center}
  .brand{font-size:34px;font-weight:900}.brand .x{color:#f59e0b}
  .leaf{position:absolute;top:60px;right:88px;font-size:66px}
  h1{font-size:94px;font-weight:900;line-height:1.02;letter-spacing:-.01em;position:relative}
  h1 .lg{color:#6ee7b7}
  .rule{width:132px;height:9px;background:#6ee7b7;border-radius:99px;margin:38px 0 40px;position:relative}
  .lines{display:flex;flex-direction:column;gap:24px;position:relative;margin-bottom:52px}
  .ln{display:flex;align-items:center;gap:22px;font-size:37px;font-weight:600;line-height:1.22}
  .ln .em{font-size:44px;flex:none;opacity:.95}
  .q{font-size:47px;font-weight:800;line-height:1.22;position:relative;
    border-left:8px solid rgba(110,231,183,.75);padding-left:32px}
  .q .lg{color:#6ee7b7}
  .foot{position:absolute;bottom:78px;left:90px;right:90px;display:flex;
    justify-content:space-between;align-items:center;font-size:32px}
  .tag{font-weight:900;color:#6ee7b7;letter-spacing:.01em}
  .site{opacity:.8;font-weight:600}
</style></head>
<body>
  <div class="glow"></div>
  <div class="watermark">🌱</div>
  <div class="top"><div class="logo">X</div><div class="brand"><span class="x">Xoul</span>Tec</div></div>
  <div class="leaf">🌱</div>

  <h1>Digitalizar<br>también es<br><span class="lg">conservar</span>.</h1>
  <div class="rule"></div>

  <div class="lines">
    <div class="ln"><span class="em">📄</span><span>Una factura que no se imprime.</span></div>
    <div class="ln"><span class="em">🗂️</span><span>Un expediente que no va a una carpeta.</span></div>
    <div class="ln"><span class="em">🛣️</span><span>Un viaje que nadie tuvo que hacer.</span></div>
  </div>

  <div class="q">¿Cuánto papel dejó de<br>imprimir tu negocio<br><span class="lg">este año</span>?</div>

  <div class="foot">
    <div class="tag">#DigitalEsVerde</div>
    <div class="site">xoultec.com</div>
  </div>
</body></html>
