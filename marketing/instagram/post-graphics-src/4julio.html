<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    background: linear-gradient(150deg, #0f172a 0%, #1e3a5f 55%, #7f1d1d 100%);
    color: #fff; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .stars { position: absolute; top: 6%; left: 0; right: 0; text-align: center;
    font-size: 44px; letter-spacing: 18px; opacity: .55; }
  .wrap { position: relative; z-index: 2; padding: 0 72px; }
  .flag { font-size: 96px; margin-bottom: 8px; }
  .kicker { font-size: 40px; font-weight: 700; letter-spacing: 1px; color: #f59e0b; margin-bottom: 26px; }
  h1 { font-size: 86px; line-height: 1.05; font-weight: 900; margin-bottom: 6px; }
  h1 .amber { color: #f59e0b; }
  .en { font-size: 34px; opacity: .8; font-weight: 600; margin: 14px 0 30px; }
  .pills { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-bottom: 40px; }
  .pill { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 12px 26px; font-size: 30px; font-weight: 600; }
  .cta { display: inline-block; background: #f59e0b; color: #0f172a; font-weight: 900;
    font-size: 42px; padding: 20px 44px; border-radius: 999px; }
  .foot { position: absolute; bottom: 54px; left: 0; right: 0; z-index: 2; text-align: center; }
  .brand { font-size: 44px; font-weight: 900; letter-spacing: 1px; }
  .brand .x { color: #f59e0b; }
  .contact { font-size: 28px; opacity: .82; margin-top: 8px; }
</style>
</head>
<body>
  <div class="stripes"></div>
  <div class="stars">★ ★ ★ ★ ★ ★ ★</div>
  <div class="wrap">
    <div class="kicker" style="margin-top:40px">¡FELIZ 4 DE JULIO! · HAPPY 4TH OF JULY</div>
    <h1>Dale <span class="amber">independencia</span><br>a tu negocio</h1>
    <div class="en">Give your business its independence too</div>
    <div class="pills">
      <span class="pill">ERP</span>
      <span class="pill">POS</span>
      <span class="pill">Nómina · RD + USA</span>
      <span class="pill">Facturación</span>
    </div>
    <div class="cta">🎁 Primer mes GRATIS</div>
  </div>
  <div class="foot">
    <div class="brand"><span class="x">X</span>oulTec</div>
    <div class="contact">DM: "MES GRATIS" · WhatsApp (913) 413-6583 · xoultec.com</div>
  </div>
</body>
</html>
