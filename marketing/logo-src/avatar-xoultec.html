<!doctype html>
<html lang="es"><head><meta charset="utf-8"/>
<!--
  Foto de perfil de XoulTec — versión APILADA (X arriba, wordmark debajo) sobre navy.
  Es la que usa WhatsApp Business y la que Rubén prefiere (13-ago-2026); Instagram tenía
  la horizontal, que dentro del círculo queda apretada y el wordmark casi toca el borde.

  Render 1080×1080. Las redes recortan a círculo: todo lo importante vive dentro del
  círculo inscrito, con aire de sobra en las esquinas.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    width:1080px;height:1080px;overflow:hidden;background:#0f172a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:52px}

  .caja{width:330px;height:330px;border-radius:76px;background:#f59e0b;
    display:flex;align-items:center;justify-content:center}
  .x{font-size:216px;font-weight:900;color:#0f172a;line-height:1;letter-spacing:-.02em}

  .wordmark{font-size:132px;font-weight:900;letter-spacing:-.01em;line-height:1}
  .wordmark .xoul{color:#fff}
  .wordmark .tec{color:#f59e0b}
</style></head>
<body>
  <div class="caja"><div class="x">X</div></div>
  <div class="wordmark"><span class="xoul">Xoul</span><span class="tec">Tec</span></div>
</body></html>
